<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDD API</title>
  <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css">
</head>
<body>
  <main>
    <h1>MDD API</h1>
    <p>Technical entry point for the MDD backend.</p>
    <div class="status-block" id="service-status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Service status: <strong id="service-status-text">Checking...</strong></span>
    </div>
    <div class="actions">
      <a th:href="@{/swagger-ui/index.html}" href="/swagger-ui/index.html">Open Swagger UI</a>
      <button type="button" id="refresh-status">Refresh service status</button>
      <a
        class="secondary-link"
        th:href="@{/actuator/health}"
        href="/actuator/health"
        target="_blank"
        rel="noopener noreferrer"
      >View health details</a>
    </div>
  </main>
  <script th:src="@{/js/home-status.js}" src="/js/home-status.js"></script>
</body>
</html>
