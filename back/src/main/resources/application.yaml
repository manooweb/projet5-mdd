spring:
  application:
    name: mdd-api
  datasource:
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        connectTimeout: 5000
        socketTimeout: 30000

server:
  port: 9001

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
