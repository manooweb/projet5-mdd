spring:
  application:
    name: mdd-api
  config:
    import:
      - optional:file:.env[.properties]
      - classpath:mdd.yml
  datasource:
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        connectTimeout: 5000
        socketTimeout: 30000
  mail:
    host: ${MDD_MAIL_HOST:localhost}
    port: ${MDD_MAIL_PORT:1025}

server:
  port: 9001

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
