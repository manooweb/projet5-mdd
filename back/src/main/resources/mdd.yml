mdd:
  jwt:
    secret: ${MDD_JWT_SECRET}
    expiration: ${MDD_JWT_EXPIRATION:PT8H}
    secure-cookie: ${MDD_JWT_SECURE_COOKIE:true}
  messages:
    duplicate-identity: Username or email is already used.
    invalid-credentials: Invalid credentials.
    validation:
      invalid-request: The request contains an invalid value.
      username-required: Username is required.
      username-max-size: Username must not exceed %d characters.
      email-required: Email is required.
      email-invalid: Email must be valid.
      email-max-size: Email must not exceed %d characters.
      password-required: Password is required.
      password-size: Password must contain between %d and %d characters.
    errors:
      authentication-required: Authentication is required.
      access-denied: Access is denied.
      resource-not-found: The requested resource was not found.
      unexpected: An unexpected error occurred.
