<app-header />

<main class="mx-auto w-full p-6 md:p-8">
  <div class="mb-8 flex flex-col items-center gap-4 sm:flex-row sm:justify-between">
    <a
      class="inline-flex h-auto min-h-10 w-[9.25rem] items-center justify-center rounded-lg bg-primary px-4 py-1 text-center leading-5 font-semibold text-white hover:bg-primary-700 active:bg-primary-800 sm:w-auto sm:px-5"
      routerLink="/posts/create"
      aria-label="Créer un article"
    >
      Créer un article
    </a>

    <button
      class="sort-action inline-flex gap-2 font-semibold text-black hover:text-primary"
      [class.sort-action--ascending]="sortDirection() === 'asc'"
      type="button"
      [attr.aria-label]="
        sortDirection() === 'desc'
          ? 'Trier par date, ordre décroissant'
          : 'Trier par date, ordre croissant'
      "
      (click)="toggleSort()"
    >
      Trier par date
      <app-down-arrow-icon class="h-4 w-2" />
    </button>
  </div>

  @if (posts$() | async; as posts) {
    <section class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      @for (post of posts; track post.id) {
        <a
          class="group cursor-pointer rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
          [routerLink]="['/posts', post.id]"
          [attr.aria-label]="'Lire l’article ' + post.title"
        >
          <article
            class="flex min-h-60 flex-col rounded-lg border border-transparent bg-[#f5f5f5] p-6 text-black shadow-sm transition-colors group-hover:border-primary group-hover:bg-primary-50"
          >
            <p class="text-xl font-bold">{{ post.title }}</p>
            <div class="mt-3 flex gap-3 text-sm">
              <span class="post-date">{{ post.createdAt | date: 'dd/MM/yyyy' }}</span>
              <span class="post-author">{{ post.author }}</span>
              <span class="post-topic">{{ post.topic }}</span>
            </div>
            <p class="mt-4 line-clamp-4 whitespace-pre-line leading-relaxed">{{ post.content }}</p>
          </article>
        </a>
      }
    </section>
  } @else {
    <output class="flex min-h-64 flex-col items-center justify-center gap-4" aria-live="polite">
      <p-progress-spinner ariaLabel="Chargement des articles" />
      <span class="text-sm text-black">Chargement des articles...</span>
    </output>
  }
</main>
