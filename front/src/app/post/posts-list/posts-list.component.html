<app-header />

<main class="mx-auto w-full max-w-6xl p-6 md:p-8">
  <h1 class="text-2xl font-bold text-black">Articles</h1>

  @if (loading()) {
    <div class="flex min-h-64 flex-col items-center justify-center gap-4" role="status">
      <p-progress-spinner ariaLabel="Chargement des articles" />
      <p class="text-sm text-black">Chargement des articles...</p>
    </div>
  }
</main>
