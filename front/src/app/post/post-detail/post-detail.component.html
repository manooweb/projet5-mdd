<app-header />

<main class="mx-auto w-full max-w-3xl p-6 md:p-8">
  @if (post$ | async; as post) {
    <div class="mb-8 flex flex-col gap-4 md:flex-row md:items-center">
      <app-back-button target="/posts" label="Retour aux articles" />
      <h1 class="text-center text-2xl font-bold text-black md:text-left">{{ post.title }}</h1>
    </div>

    <article class="text-black">
      <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm">
        <span>{{ post.createdAt | date: 'dd/MM/yyyy' }}</span>
        <span>{{ post.author }}</span>
        <span>{{ post.topic }}</span>
      </div>
      <p class="mt-6 whitespace-pre-line leading-relaxed">{{ post.content }}</p>
    </article>

    <app-post-comments [comments]="post.comments" />
  } @else {
    <div class="mb-8 flex flex-col gap-4 md:flex-row md:items-center">
      <app-back-button target="/posts" label="Retour aux articles" />
      <h1 class="text-center text-2xl font-bold text-black md:text-left">Détail de l'article</h1>
    </div>

    <output class="flex min-h-64 flex-col items-center justify-center gap-4" aria-live="polite">
      <p-progress-spinner ariaLabel="Chargement de l'article" />
      <span class="text-sm text-black">Chargement de l'article...</span>
    </output>
  }
</main>
