<app-header />

<main class="mx-auto w-full p-6 md:p-8">
  @if (topics$ | async; as topics) {
    <section class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      @for (topic of topics; track topic.id) {
        <article class="flex min-h-60 flex-col rounded-lg bg-[#f5f5f5] p-6 text-black shadow-sm">
          <p class="text-xl font-bold">{{ topic.name }}</p>
          <p class="mt-4 flex-1 leading-relaxed">{{ topic.description }}</p>
          <button
            class="mt-6 h-10 self-center rounded-lg px-6 font-semibold text-white disabled:cursor-not-allowed disabled:bg-[#939393]"
            [class.bg-primary]="!topic.subscribed"
            [class.hover:bg-primary-700]="!topic.subscribed"
            [class.active:bg-primary-800]="!topic.subscribed"
            type="button"
            [disabled]="topic.subscribed"
            (click)="subscribe(topic)"
          >
            {{ topic.subscribed ? 'Déjà abonné' : "S'abonner" }}
          </button>
        </article>
      }
    </section>
  } @else {
    <output class="flex min-h-64 flex-col items-center justify-center gap-4" aria-live="polite">
      <p-progress-spinner ariaLabel="Chargement des thèmes" />
      <span class="text-sm text-black">Chargement des thèmes...</span>
    </output>
  }
</main>
