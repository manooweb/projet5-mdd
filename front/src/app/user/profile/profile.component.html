<app-header />

<main class="mx-auto w-full max-w-6xl p-6 md:p-8">
  <section class="mx-auto w-full max-w-md">
    <h1 class="mb-8 text-center text-2xl font-bold text-black">Profil utilisateur</h1>

    @if (apiError(); as error) {
      <app-api-error [error]="error" />
    }

    <form [formGroup]="profileForm" class="flex flex-col gap-5" novalidate (ngSubmit)="save()">
      <app-account-fields [form]="profileForm" />

      <button
        pButton
        class="mt-3 flex h-10 w-full justify-center rounded-lg bg-primary font-semibold text-white hover:bg-primary-700 active:bg-primary-800 disabled:cursor-not-allowed disabled:bg-primary-300"
        type="submit"
        [disabled]="!hasChanges() || profileForm.invalid || isSubmitting()"
      >
        Sauvegarder
      </button>
    </form>
  </section>

  <section class="mt-12 border-t border-black pt-8">
    <h2 class="mb-6 text-center text-2xl font-bold text-black">Abonnements</h2>

    @if (topics$ | async; as topics) {
      <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
        @for (topic of topics; track topic.id) {
          @if (topic.subscribed) {
            <article
              class="flex min-h-60 flex-col rounded-lg bg-[#f5f5f5] p-6 text-black shadow-sm"
            >
              <p class="text-xl font-bold">{{ topic.name }}</p>
              <p class="mt-4 flex-1 leading-relaxed">{{ topic.description }}</p>
              <button
                class="mt-6 h-10 self-center rounded-lg bg-primary px-6 font-semibold text-white hover:bg-primary-700 active:bg-primary-800"
                type="button"
                (click)="unsubscribe(topic.id)"
              >
                Se désabonner
              </button>
            </article>
          }
        }
      </div>
    }
  </section>
</main>
