<div [formGroup]="form()" class="flex flex-col gap-5">
  <div class="flex flex-col gap-2">
    <label for="username" class="font-semibold text-black">Nom d’utilisateur</label>
    <input
      pInputText
      id="username"
      name="username"
      autocomplete="username"
      class="h-10 w-full rounded-lg border border-black bg-white px-3 text-black focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"
      formControlName="username"
      [pAutoFocus]="autofocusUsername()"
      aria-describedby="username-feedback"
      type="text"
    />
    <app-form-validation-feedback
      [control]="form().controls.username"
      feedbackId="username-feedback"
      message="Le nom d’utilisateur est obligatoire."
    />
  </div>

  <div class="flex flex-col gap-2">
    <label for="email" class="font-semibold text-black">Adresse e-mail</label>
    <input
      pInputText
      id="email"
      name="email"
      autocomplete="email"
      class="h-10 w-full rounded-lg border border-black bg-white px-3 text-black focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"
      formControlName="email"
      aria-describedby="email-feedback"
      type="email"
    />
    <app-form-validation-feedback
      [control]="form().controls.email"
      feedbackId="email-feedback"
      message="Une adresse e-mail valide est obligatoire."
    />
  </div>

  <div class="flex flex-col gap-2">
    <label for="password" class="font-semibold text-black">Mot de passe</label>
    <p-password
      inputId="password"
      name="password"
      autocomplete="new-password"
      inputStyleClass="h-10 w-full rounded-lg border border-black bg-white px-3 text-black focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"
      [feedback]="true"
      [fluid]="true"
      [strongRegex]="passwordStrengthRegex"
      [toggleMask]="true"
      promptLabel="Saisissez un mot de passe"
      weakLabel="Faible"
      mediumLabel="Moyen"
      strongLabel="Fort"
      formControlName="password"
      [pt]="{ pcInputText: { root: { 'aria-describedby': 'password-feedback' } } }"
    />
    <app-form-validation-feedback
      [control]="form().controls.password"
      feedbackId="password-feedback"
      message="Le mot de passe doit comporter de 8 à 72 caractères, dont un chiffre, une minuscule, une majuscule et un caractère spécial."
    />
  </div>
</div>
