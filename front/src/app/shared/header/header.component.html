<header
  class="flex h-20 items-center border-b border-black bg-white px-4 sm:h-24 sm:px-8"
  [class.max-md:hidden]="authentication()"
>
  <a [routerLink]="homeLink()" aria-label="Accueil MDD">
    <img class="h-auto w-32 sm:w-36 lg:w-40" src="assets/logo_p6.png" alt="MDD" />
  </a>

  @if (!authentication()) {
    <div class="ml-auto hidden items-center gap-5 md:flex">
      <app-logout-button />
      <app-navigation-links />
    </div>
    <app-mobile-navigation class="ml-auto flex md:hidden" />
  }
</header>
