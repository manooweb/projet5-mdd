<header
  class="flex h-20 items-center border-b border-black bg-white px-4 sm:h-24 sm:px-8"
  [class.max-md:hidden]="authentication()"
>
  <a routerLink="/" aria-label="Accueil MDD">
    <img class="h-auto w-32 sm:w-36 lg:w-40" src="assets/logo_p6.png" alt="MDD" />
  </a>

  @if (!authentication()) {
    <button
      class="ml-auto inline-flex h-10 w-10 items-center justify-center rounded-lg text-black lg:hidden"
      type="button"
      aria-label="Ouvrir le menu de navigation"
    >
      <svg data-p-icon="bars" [size]="24"></svg>
    </button>
  }
</header>
